<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Crescent Moon Symbol in upper right -->
  <path d="M 370 100 C 400 130 400 170 370 200 C 340 230 300 230 270 200 C 320 220 370 180 370 100 Z" fill="#38bdf8" opacity="0.85" filter="url(#glow)"/>

  <!-- Download Arrow -->
  <g filter="url(#glow)">
    <!-- Shaft -->
    <rect x="231" y="160" width="50" height="150" rx="10" fill="#ffffff" />
    <!-- Head -->
    <path d="M 166 295 L 346 295 L 256 385 Z" fill="url(#cyanGrad)" />
    <!-- Cradle / Base tray -->
    <rect x="156" y="405" width="200" height="24" rx="10" fill="url(#cyanGrad)" />
  </g>
</svg>
